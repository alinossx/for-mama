<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Маленький</title>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Pacifico&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Comfortaa', sans-serif;
      background: #0a0a12;
      color: #fff;
      overflow: hidden;
      height: 100vh;
      height: 100dvh;
    }

    /* ========== СТАРТОВЫЙ ЭКРАН ========== */
    #start-screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #1a1030 0%, #0d0a1a 100%);
      z-index: 100;
      transition: opacity 0.8s ease, visibility 0.8s;
    }
    
    #start-screen.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    
    .start-btn {
      padding: 22px 70px;
      font-size: 1.6rem;
      font-weight: 700;
      font-family: 'Comfortaa', sans-serif;
      color: #fff;
      background: linear-gradient(135deg, #ff6b8a, #c44569);
      border: none;
      border-radius: 60px;
      cursor: pointer;
      box-shadow: 0 12px 40px rgba(255, 80, 120, 0.4);
      transition: all 0.3s ease;
      letter-spacing: 1px;
    }
    
    .start-btn:hover {
      transform: scale(1.07);
      box-shadow: 0 16px 50px rgba(255, 80, 120, 0.55);
    }

    /* ========== ОСНОВНЫЕ СЦЕНЫ ========== */
    .scene {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 1.1s ease, visibility 1.1s;
      padding: 20px;
      overflow: hidden;
    }
    
    .scene.active {
      opacity: 1;
      visibility: visible;
      z-index: 10;
    }

    /* Текст */
    .lyric {
      font-size: clamp(1.15rem, 4.2vw, 1.7rem);
      text-align: center;
      line-height: 1.5;
      max-width: 90%;
      text-shadow: 0 2px 20px rgba(0,0,0,0.5);
      opacity: 0;
      transform: translateY(18px);
      transition: all 0.8s ease;
    }
    
    .lyric.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* ========== СЦЕНА 1: Маленький + солнышко ========== */
    #scene1 {
      background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 40%, #FFF8E1 100%);
    }
    
    .figure {
      font-size: 7rem;
      transition: all 2.2s cubic-bezier(0.34, 1.2, 0.64, 1);
      filter: drop-shadow(0 8px 20px rgba(0,0,0,0.15));
      z-index: 5;
    }
    
    .figure.small {
      font-size: 3.2rem;
      transform: translateY(30px);
    }
    
    .sun {
      position: absolute;
      top: 8%;
      right: 8%;
      font-size: 4.5rem;
      opacity: 0;
      transform: scale(0.3) rotate(-30deg);
      transition: all 1.4s cubic-bezier(0.34, 1.4, 0.64, 1);
      filter: drop-shadow(0 0 25px rgba(255, 200, 50, 0.7));
    }
    
    .sun.show {
      opacity: 1;
      transform: scale(1) rotate(0deg);
    }
    
    .cloud {
      position: absolute;
      font-size: 2.8rem;
      opacity: 0;
      transition: all 1.2s ease;
    }
    
    .cloud1 { top: 12%; left: 10%; transition-delay: 0.3s; }
    .cloud2 { top: 18%; left: 28%; transition-delay: 0.5s; font-size: 2.2rem; }
    .cloud3 { top: 8%; right: 28%; transition-delay: 0.4s; font-size: 2.5rem; }
    
    .cloud.show {
      opacity: 0.9;
      transform: translateY(0);
    }
    
    .cloud:not(.show) {
      transform: translateY(-20px);
    }

    /* ========== СЦЕНА 2: Мама ========== */
    #scene2 {
      background: linear-gradient(160deg, #2a1a3a 0%, #1a1025 100%);
    }
    
    .photo-frame {
      width: min(280px, 70vw);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.45);
      opacity: 0;
      transform: scale(0.85) translateY(30px);
      transition: all 1.2s cubic-bezier(0.34, 1.2, 0.64, 1);
      border: 6px solid #fff;
      position: relative;
    }
    
    .photo-frame.show {
      opacity: 1;
      transform: scale(1) translateY(0);
    }
    
    .photo-frame img {
      width: 100%;
      display: block;
      filter: contrast(1.05) saturate(0.9);
    }
    
    /* эффект "нарисовано" */
    .photo-frame::after {
      content: '';
      position: absolute;
      inset: 0;
      background: 
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.03) 2px, rgba(255,255,255,0.03) 3px);
      pointer-events: none;
    }
    
    .photo-caption {
      margin-top: 22px;
      font-size: clamp(1.1rem, 3.8vw, 1.45rem);
      text-align: center;
      opacity: 0;
      transition: opacity 0.9s ease 0.4s;
      color: #ffb6c1;
    }
    
    .photo-caption.show {
      opacity: 1;
    }

    /* ========== СЦЕНА 3: Разделённый экран ========== */
    #scene3 {
      background: #0f0a18;
      flex-direction: row;
      padding: 0;
    }
    
    .half {
      width: 50%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 12px;
      position: relative;
      transition: all 0.8s ease;
    }
    
    .half-left {
      background: linear-gradient(180deg, #3a2a1a 0%, #1a120a 100%);
      border-right: 2px solid rgba(255,255,255,0.08);
    }
    
    .half-right {
      background: linear-gradient(180deg, #1a1a2e 0%, #0d0d18 100%);
    }
    
    .scene-emoji {
      font-size: 4.2rem;
      margin-bottom: 18px;
      filter: drop-shadow(0 6px 15px rgba(0,0,0,0.3));
    }
    
    .half-text {
      font-size: clamp(0.95rem, 3.2vw, 1.25rem);
      text-align: center;
      line-height: 1.45;
      opacity: 0;
      transform: translateY(15px);
      transition: all 0.8s ease;
      max-width: 95%;
    }
    
    .half-text.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* ========== СЦЕНА 4: Дерево + плохие слова ========== */
    #scene4 {
      background: linear-gradient(180deg, #2d4a22 0%, #1a2e15 50%, #0f1a0c 100%);
    }
    
    .tree-area {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
    }
    
    .tree {
      font-size: 6.5rem;
      filter: drop-shadow(0 10px 25px rgba(0,0,0,0.35));
    }
    
    .child-under {
      font-size: 2.8rem;
      margin-top: -25px;
      position: relative;
      z-index: 2;
    }
    
    .bad-word {
      position: absolute;
      font-size: 1.1rem;
      font-weight: 700;
      color: #ff6b6b;
      opacity: 0;
      animation: floatBad 3.5s ease-in-out infinite;
      text-shadow: 0 0 10px rgba(255,80,80,0.5);
    }
    
    @keyframes floatBad {
      0%, 100% { transform: translateY(0) rotate(-5deg); opacity: 0.85; }
      50% { transform: translateY(-18px) rotate(5deg); opacity: 1; }
    }
    
    .rest-lyrics {
      max-width: 90%;
      text-align: center;
      margin-top: 15px;
    }
    
    .rest-line {
      font-size: clamp(1rem, 3.5vw, 1.35rem);
      margin: 10px 0;
      opacity: 0;
      transform: translateY(12px);
      transition: all 0.7s ease;
      line-height: 1.4;
    }
    
    .rest-line.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* ========== ФИНАЛ ========== */
    #scene-final {
      background: linear-gradient(160deg, #1a0a2e 0%, #2d1b4e 50%, #1a1025 100%);
    }
    
    .final-photo {
      width: min(300px, 75vw);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0,0,0,0.5);
      border: 5px solid rgba(255,200,220,0.3);
      opacity: 0;
      transform: scale(0.9);
      transition: all 1.3s cubic-bezier(0.34, 1.2, 0.64, 1);
    }
    
    .final-photo.show {
      opacity: 1;
      transform: scale(1);
    }
    
    .final-photo img {
      width: 100%;
      display: block;
    }
    
    .final-text {
      margin-top: 28px;
      font-size: 1.2rem;
      color: #ffb6c1;
      opacity: 0;
      transition: opacity 1s ease 0.5s;
    }
    
    .final-text.show {
      opacity: 1;
    }

    /* Адаптив */
    @media (max-width: 600px) {
      .figure { font-size: 5.5rem; }
      .figure.small { font-size: 2.6rem; }
      .sun { font-size: 3.5rem; }
      .scene-emoji { font-size: 3.2rem; }
      .tree { font-size: 5rem; }
      .child-under { font-size: 2.3rem; }
    }
  </style>
</head>
<body>

  <!-- СТАРТ -->
  <div id="start-screen">
    <button class="start-btn" id="startBtn">начать</button>
  </div>

  <!-- СЦЕНА 1 -->
  <div class="scene" id="scene1">
    <div class="sun" id="sun">☀️</div>
    <div class="cloud cloud1" id="cloud1">☁️</div>
    <div class="cloud cloud2" id="cloud2">☁️</div>
    <div class="cloud cloud3" id="cloud3">☁️</div>
    
    <div class="figure" id="figure">🧍</div>
    <div class="lyric" id="lyric1" style="margin-top: 25px;"></div>
  </div>

  <!-- СЦЕНА 2 -->
  <div class="scene" id="scene2">
    <div class="photo-frame" id="mamaPhoto">
      <!-- Сюда потом положишь фото мамы: mama1.jpg -->
      <img src="mama1.jpg" alt="Мама" onerror="this.style.display='none'; this.parentElement.innerHTML='<div style=\'padding:60px 20px;text-align:center;background:#3a2a4a;color:#ffb6c1;font-size:1.1rem;\'>📷<br>Положи сюда<br><b>mama1.jpg</b></div>';">
    </div>
    <div class="photo-caption" id="mamaCaption">мама опять сильнее всех в мире</div>
  </div>

  <!-- СЦЕНА 3 -->
  <div class="scene" id="scene3">
    <div class="half half-left">
      <div class="scene-emoji">🏃‍♂️🐕</div>
      <div class="half-text" id="textLeft">я снова боюсь собак</div>
    </div>
    <div class="half half-right">
      <div class="scene-emoji">🏠😨</div>
      <div class="half-text" id="textRight">и оставаться один<br>в квартире</div>
    </div>
  </div>

  <!-- СЦЕНА 4 -->
  <div class="scene" id="scene4">
    <div class="tree-area" id="treeArea">
      <div class="tree">🌳</div>
      <div class="child-under">🧒</div>
      <!-- плохие слова появятся через JS -->
    </div>
    <div class="rest-lyrics" id="restLyrics"></div>
  </div>

  <!-- ФИНАЛ -->
  <div class="scene" id="scene-final">
    <div class="final-photo" id="finalPhoto">
      <img src="mama2.jpg" alt="Мама" onerror="this.style.display='none'; this.parentElement.innerHTML='<div style=\'padding:70px 20px;text-align:center;background:#2a1a3a;color:#ffb6c1;font-size:1.15rem;\'>📷<br>Положи сюда<br><b>mama2.jpg</b></div>';">
    </div>
    <div class="final-text" id="finalText">❤️</div>
  </div>

  <audio id="song" preload="auto">
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <script>
    const startScreen = document.getElementById('start-screen');
    const startBtn = document.getElementById('startBtn');
    const audio = document.getElementById('song');

    const scenes = {
      1: document.getElementById('scene1'),
      2: document.getElementById('scene2'),
      3: document.getElementById('scene3'),
      4: document.getElementById('scene4'),
      final: document.getElementById('scene-final')
    };

    function showScene(name) {
      Object.values(scenes).forEach(s => s.classList.remove('active'));
      if (scenes[name]) scenes[name].classList.add('active');
    }

    // ========== ТАЙМИНГИ (можно подкрутить) ==========
    // Примерные секунды от начала песни
    const timeline = [
      { time: 0.5,  action: () => {
          showScene(1);
          document.getElementById('lyric1').textContent = 'Я снова маленький, солнце яркое';
          document.getElementById('lyric1').classList.add('show');
        }
      },
      { time: 2.0,  action: () => {
          document.getElementById('figure').classList.add('small');
          document.getElementById('figure').textContent = '🧒';
        }
      },
      { time: 3.2,  action: () => {
          document.getElementById('sun').classList.add('show');
          document.getElementById('cloud1').classList.add('show');
          document.getElementById('cloud2').classList.add('show');
          document.getElementById('cloud3').classList.add('show');
        }
      },
      { time: 8.5,  action: () => {
          showScene(2);
          setTimeout(() => {
            document.getElementById('mamaPhoto').classList.add('show');
            document.getElementById('mamaCaption').classList.add('show');
          }, 300);
        }
      },
      { time: 16.0, action: () => {
          showScene(3);
          setTimeout(() => {
            document.getElementById('textLeft').classList.add('show');
            document.getElementById('textRight').classList.add('show');
          }, 400);
        }
      },
      { time: 25.0, action: () => {
          showScene(4);
          spawnBadWords();
          showRestLyrics();
        }
      },
      { time: 55.0, action: () => {
          showScene('final');
          setTimeout(() => {
            document.getElementById('finalPhoto').classList.add('show');
            document.getElementById('finalText').classList.add('show');
          }, 400);
        }
      }
    ];

    function spawnBadWords() {
      const words = ['&@!', '#$%', '***', '@#$', '!!!', '&*#', '$#@', '***'];
      const area = document.getElementById('treeArea');
      
      words.forEach((w, i) => {
        setTimeout(() => {
          const el = document.createElement('div');
          el.className = 'bad-word';
          el.textContent = w;
          el.style.left = (10 + Math.random() * 70) + '%';
          el.style.top = (5 + Math.random() * 55) + '%';
          el.style.animationDelay = (Math.random() * 1.5) + 's';
          el.style.opacity = '0';
          area.appendChild(el);
          
          requestAnimationFrame(() => {
            el.style.transition = 'opacity 0.6s ease';
            el.style.opacity = '0.9';
          });
        }, i * 350);
      });
    }

    function showRestLyrics() {
      const lines = [
        'А деревья такие большие,',
        'незнакомые плохие слова',
        'Поиграем в прятки?',
        'Мне, как раньше, по пояс трава',
        '',
        'Это я не достаю до пола ногами',
        'Или пол до моих ног не достаёт?',
        'Те, кого я считал врагами',
        'Просто делают мёд, просто делают мёд',
        '',
        'Это я, только дети трясут головами',
        'Не узнали меня, говорят, что не смогут помочь',
        'Я стал сильнее, и теперь я не лягу к маме',
        'Но чудовища не пришли — я прождал их целую ночь'
      ];
      
      const container = document.getElementById('restLyrics');
      container.innerHTML = '';
      
      lines.forEach((line, i) => {
        const div = document.createElement('div');
        div.className = 'rest-line';
        div.textContent = line || ' ';
        container.appendChild(div);
        
        setTimeout(() => {
          div.classList.add('show');
        }, 800 + i * 1600);
      });
    }

    // Запуск
    startBtn.addEventListener('click', () => {
      startScreen.classList.add('hide');
      
      audio.play().catch(() => {
        console.log('Автоплей заблокирован — но анимация всё равно пойдёт');
      });
      
      // Запускаем таймлайн
      timeline.forEach(item => {
        setTimeout(item.action, item.time * 1000);
      });
    });

    // Если песня закончилась раньше — всё равно показать финал
    audio.addEventListener('ended', () => {
      showScene('final');
      document.getElementById('finalPhoto').classList.add('show');
      document.getElementById('finalText').classList.add('show');
    });
  </script>
</body>
</html>
